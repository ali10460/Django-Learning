<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>Number of Movies: {{movies | length}} movies</p>

    <table class="table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Genre</th>
          <th>Stock</th>
          <th>Daily Rental Rate</th>
        </tr>
      </thead>
      <tbody>
        {% for movie in movies %}
        <tr>
          <td>{{ movie.title }}</td>
          <td>{{ movie.genre}}</td>
          <td>{{movie.number_in_stock}}</td>
          <td>{{movie.daily_rental_rate}}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>

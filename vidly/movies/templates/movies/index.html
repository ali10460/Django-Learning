{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies</title>

    <link rel="stylesheet" href="{% static 'movies/css/style.css' %}" />
  </head>
  <body>
    <nav>Vidly</nav>
    <p>Number of Movies: {{movies | length}} movies</p>

    <div class="table-container">
      <table class="table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Genre</th>
            <th>Stock</th>
            <th>Daily Rental Rate</th>
          </tr>
        </thead>
        <tbody>
          {% for movie in movies %}
          <tr>
            <td>
              <a href="{% url 'movies:details' movie.id %}">{{movie.title}}</a>
            </td>
            <td>{{ movie.genre}}</td>
            <td>{{movie.number_in_stock}}</td>
            <td>{{movie.daily_rental_rate}}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
